rtsp: true
rtspAddress: :554
rtspTransports: [udp, tcp]

paths:
  live/main_stream_1:
    runOnInit: /usr/bin/ffmpeg -hide_banner -loglevel warning -f v4l2 -input_format h264 -video_size 1280x720 -framerate 30 -i /dev/video0 -an -c:v copy -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
